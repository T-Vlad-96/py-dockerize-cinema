services:
  cinema:
    build:
      - context: .
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    command:
      sh -c "
      while ! nc -z db 5432; do
        echo 'Waiting for postgres...';
        sleep 2;
      done;
      python manage.py migrate
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./:/app
      - my_media:${MEDIA_DATA}
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - cinema_app:${PGDATA}


volumes:
  cinema_app:
  my_media:
